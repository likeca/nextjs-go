version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/db/migrations"
    queries: "internal/accounts/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/accounts/sqlc"
        sql_package: "pgx/v5"
        emit_db_tags: true
        emit_pointers_for_null_types: true
        emit_result_struct_pointers: true
        emit_params_struct_pointers: true
        overrides:
          - db_type: "uuid"
            go_type: "string"
            nullable: false
          - db_type: "uuid"
            go_type: "github.com/jackc/pgx/v5/pgtype.UUID"
            nullable: true
          - db_type: "timestamptz"
            go_type: "time.Time"
